<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>表情工作台</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header><a class="brand" href="/"><img class="brand-mascot" src="/mascot.png" alt="蓝色大肥鱼">表情工作台</a><span id="connection" class="badge">连接中</span></header>
<main><div id="notice" role="status" aria-live="polite"></div><div class="columns">
<aside class="controls"><section><h2>定期采集</h2><p class="hint">从小红书发现新表情</p><form id="preferences"><label class="switch">自动采集<input id="enabled" type="checkbox" role="switch"></label><label class="direction">采集方向<input id="prompt" maxlength="100" placeholder="例如：奶龙、猫咪、打工人"><small>留空则不限方向</small></label><label class="interval">采集间隔 <span><input id="hours" aria-label="采集间隔（小时）" type="number" min="1" max="720" value="84" required> 小时</span></label><p id="schedule" class="small"></p><button class="primary" type="submit">保存设置</button><span id="saved" class="small"></span></form><button id="collect-now" class="wide">立即采集</button><p id="collection-result" class="hint"></p></section>
<section><h2>聊天表情</h2><form id="delivery-settings"><label class="switch">自动选图<input id="send-enabled" type="checkbox" role="switch"></label><label>发送频率<select id="send-frequency"><option value="every">每轮一张</option><option value="natural">自然适量</option><option value="requested">仅用户要求</option></select></label><label>表情风格<select id="send-style"><option value="跟随聊天">跟随聊天</option><!-- style-options --></select></label><label class="switch">优先不重复<input id="send-repeat" type="checkbox" role="switch"></label><button class="primary" type="submit">保存发送规则</button></form><p class="hint">模型按标签与语境选图，使用平台不限。</p></section><section class="annotation"><h2>自动标注</h2><p id="vision-status" class="hint">检查中</p><button id="annotate-now" class="wide">标注待处理图片</button></section>
<details><summary>连接与自检</summary><label>Chrome 端口 <input id="port" type="number" min="1025" max="65535" value="9222"></label><button id="bind">连接浏览器</button><button id="check">检查环境</button><p class="hint">首次使用请在浏览器登录小红书。</p><pre id="diagnostics"></pre></details></aside>
<section class="library"><div class="section-head"><div><h1>我的图库</h1><p id="counts" class="small">读取中</p></div><div class="library-actions"><button id="refresh" aria-label="刷新图库">刷新</button><button id="folder">打开文件夹</button><label class="file-button primary">导入图片<input id="upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple></label></div></div>
<form id="connect-library"><input id="library-path" aria-label="已有图库路径" placeholder="粘贴已有图库的文件夹路径" required><button type="submit">连接图库</button></form><div id="library-roots"></div>
<nav id="library-tabs" class="library-tabs" aria-label="图库分类"><button type="button" data-origin="全部" aria-pressed="true">全部</button><button type="button" data-origin="已有图库" aria-pressed="false">已有图库</button><button type="button" data-origin="用户发送" aria-pressed="false">用户导入</button><button type="button" data-origin="小红书采集" aria-pressed="false">小红书采集</button></nav><p id="library-origin" class="hint"></p><div id="gallery" class="gallery"></div>
</section></div><footer><details><summary>数据位置</summary><span id="folder-path"></span></details><span>本机运行 · 0.3.0</span></footer></main>
<dialog id="editor"><form method="dialog"><button class="close" aria-label="关闭">×</button></form><h2>表情含义</h2><div id="edit-image"></div><p id="edit-source" class="hint"></p><label>图中文字<input id="meaning-text" maxlength="120"></label><label>具体含义<textarea id="meaning-description" rows="2" maxlength="140"></textarea></label><label>适合怎样接话<textarea id="meaning-when" rows="2" maxlength="120"></textarea></label><div id="tag-fields" class="tag-fields"></div><label>把握程度<select id="confidence"><option value="0.9">已经看清，理解明确</option><option value="0.6">不太确定，暂不使用</option></select></label><label><input id="usable" type="checkbox" checked>可用</label><p class="hint">按住 Ctrl 多选标签。</p><button id="save-meaning" class="primary">保存标注</button><p id="edit-message" role="status"></p></dialog>
</body></html>
